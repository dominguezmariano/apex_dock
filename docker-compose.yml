services:
  db:
    image: container-registry.oracle.com/database/free:latest
    container_name: apex-db
    restart: unless-stopped
    ports:
      - "1521:1521"
      - "5500:5500"
    environment:
      ORACLE_PWD: ${ORACLE_PWD}
      ORACLE_CHARACTERSET: AL32UTF8
      APEX_ADMIN_PWD: ${APEX_ADMIN_PWD}
      APEX_ADMIN_EMAIL: ${APEX_ADMIN_EMAIL}
    volumes:
      - oradata:/opt/oracle/oradata
      - ./init-scripts:/opt/oracle/scripts/setup
      - ./downloads/apex-latest.zip:/opt/oracle/apex-installer/apex-latest.zip:ro
      - ./apex-images:/opt/oracle/apex-images
    healthcheck:
      test: ["CMD", "/opt/oracle/checkDBStatus.sh"]
      interval: 30s
      timeout: 10s
      retries: 30
      start_period: 25m
    networks:
      - apex-net

  ords:
    image: container-registry.oracle.com/database/ords:latest
    container_name: apex-ords
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8181:8080"
    environment:
      ORACLE_PWD: ${ORACLE_PWD}
      DBHOST: db
      DBPORT: 1521
      DBSERVICENAME: FREEPDB1
    volumes:
      - ords-config:/etc/ords/config
      - ./apex-images:/opt/oracle/apex/images:ro
    networks:
      - apex-net

volumes:
  oradata:
    name: apex-oradata
  ords-config:
    name: apex-ords-config

networks:
  apex-net:
    name: apex-net
    driver: bridge
