services:
  db:
    image: container-registry.oracle.com/database/free:latest
    container_name: apex-db
    restart: unless-stopped
    ports:
      - "1521:1521"
      - "5500:5500"
    environment:
      ORACLE_PWD: ${ORACLE_PWD}
      ORACLE_CHARACTERSET: AL32UTF8
      APEX_ADMIN_PWD: ${APEX_ADMIN_PWD}
      APEX_ADMIN_EMAIL: ${APEX_ADMIN_EMAIL}
    # Las imagenes recientes de Oracle Free (26ai) traen una DB pre-construida
    # adentro de la imagen con el marcador .FREE.created ya creado, lo que hace
    # que runOracle.sh skipee los init scripts. Este entrypoint chequea nuestro
    # propio marcador (.user_init_done) y, si no esta, borra la DB prebuilt
    # para forzar un init real que corre /opt/oracle/scripts/setup/*.sh.
    entrypoint:
      - /bin/bash
      - -c
      - |
        if [ ! -f /opt/oracle/oradata/.user_init_done ]; then
          echo "==> [bootstrap] Borrando DB pre-construida de la imagen para forzar init scripts"
          rm -f /opt/oracle/oradata/.FREE.created
          rm -rf /opt/oracle/oradata/FREE
        fi
        exec /opt/oracle/runOracle.sh
    volumes:
      - oradata:/opt/oracle/oradata
      - ./init-scripts:/opt/oracle/scripts/setup
      - ./downloads/apex-latest.zip:/opt/oracle/apex-installer/apex-latest.zip:ro
      - ./apex-images:/opt/oracle/apex-images
      - ./apex-app:/opt/oracle/apex-app:ro
    healthcheck:
      test: ["CMD", "/opt/oracle/checkDBStatus.sh"]
      interval: 30s
      timeout: 10s
      retries: 30
      start_period: 25m
    networks:
      - apex-net

  ords:
    image: container-registry.oracle.com/database/ords:latest
    container_name: apex-ords
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8181:8080"
    environment:
      ORACLE_PWD: ${ORACLE_PWD}
      DBHOST: db
      DBPORT: 1521
      DBSERVICENAME: FREEPDB1
    volumes:
      - ords-config:/etc/ords/config
      - ./apex-images:/opt/oracle/apex/images:ro
      # La imagen oficial corre los .sh de /ords-entrypoint.d antes de iniciar
      # ORDS (path hardcodeado en /usr/bin/docker-entrypoint.sh linea 21). Usamos
      # ese mecanismo para habilitar plsql.gateway.mode, que esta deshabilitado
      # por default en ORDS 24+ y hace que las URLs /ords/apex y /ords/apex_admin
      # devuelvan 404.
      - ./ords-entrypoint:/ords-entrypoint.d:ro
    networks:
      - apex-net

volumes:
  oradata:
    name: apex-oradata
  ords-config:
    name: apex-ords-config

networks:
  apex-net:
    name: apex-net
    driver: bridge
